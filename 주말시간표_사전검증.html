  return frag;
}

function renderOverlap(list){
  const table = el("table", { class:"list" });
  table.append(el("tr", null, [el("th",{text:"시간"}), el("th",{text:"환자"}), el("th",{text:"겹친 곳"})]));
  list.forEach(item=>{
    const where = el("div");
    item.detail.forEach(d => where.append(el("div", null, [el("span", { class:"ref", text:d.ref }), d.what + " ", el("span", { class:"raw", text:d.raw })])));
    table.append(el("tr", null, [
      el("td", { class:"time", text: minutesText(item.minutes) }),
      el("td", { class:"nm", text:item.name }),
      el("td", null, [where])
    ]));
  });
  return table;
}

function renderColumnDup(list){
  const table = el("table", { class:"list" });
  table.append(el("tr", null, [el("th",{text:"치료사"}), el("th",{text:"환자"}), el("th",{text:"시간 · 칸"})]));
  list.forEach(item=>{
    const where = el("div");
    item.items.forEach(x => where.append(el("span", { style:"margin-right:12px;white-space:nowrap" }, [el("span", { class:"time", text:x.time + " " }), el("span", { class:"ref", text:x.ref })])));
    table.append(el("tr", null, [
      el("td", { text: item.block + " · " + item.therapist + " (" + item.column + "열)" }),
      el("td", { class:"nm", text:item.name }),
      el("td", null, [where])
    ]));
  });
  return table;
}

function renderContinuity(list){
  const table = el("table", { class:"list" });
  table.append(el("tr", null, [el("th",{text:"환자"}), el("th",{text:"구분"}), el("th",{text:"빈 시간"})]));
  list.forEach(item=>{
    table.append(el("tr", null, [
      el("td", { class:"nm", text:item.name }),
      el("td", null, [typeTag(item.type)]),
      el("td", { class:"time", text: item.gaps.map(g => g.map(minutesText).join(", ")).join("  /  ") })
    ]));
  });
  return table;
}

function countText(type, c){
  if(type === "비회복기") return "M·G " + c.mg + " · 전기 " + c.electric;
  return "1:1 " + c.one + (c.robot ? " · 로봇 " + c.robot : "") + " · 기구 " + c.machine + " · 전기 " + c.electric;
}

function renderRoutine(list){
  const table = el("table", { class:"list" });
  table.append(el("tr", null, [el("th",{text:"환자"}), el("th",{text:"구분"}), el("th",{text:"지금"}), el("th",{text:"맞지 않는 부분"})]));
  list.forEach(item=>{
    const lines = el("div");
    item.lines.forEach(t => lines.append(el("div", { text:t })));
    if(item.mixed) lines.append(el("div", { class:"raw", text:"※ H와 M·G 코드가 함께 있습니다" }));
    table.append(el("tr", null, [
      el("td", { class:"nm", text:item.name }),
      el("td", null, [typeTag(item.type)]),
      el("td", { style:"white-space:nowrap", text: countText(item.type, item.count) }),
      el("td", null, [lines])
    ]));
  });
  return table;
}

function renderNotes(list){
  const table = el("table", { class:"list" });
  table.append(el("tr", null, [el("th",{text:"환자"}), el("th",{text:"메모"}), el("th",{text:"맞지 않는 부분"})]));
  list.forEach(item=>{
    const lines = el("div");
    item.lines.forEach(t => lines.append(el("div", { text:t })));
    table.append(el("tr", null, [
      el("td", { class:"nm", text:item.name }),
      el("td", { style:"white-space:nowrap", text:item.note }),
      el("td", null, [lines])
    ]));
  });
  return table;
}

/* 읽어 들인 메모 전체 — 제대로 읽었는지 확인용 */
function renderNoteList(floor){
  const names = Object.keys(parsed.notes || {}).filter(name=>{
    const row = (lastRows[floor] || []).find(r => r.name === name);
    return !!row;
  }).sort((a,b) => a.localeCompare(b,"ko"));
  if(names.length === 0) return el("p", { class:"note", text:"이 층 환자에게 적힌 메모가 없습니다." });
  const table = el("table", { class:"list" });
  table.append(el("tr", null, [el("th",{text:"환자"}), el("th",{text:"적힌 메모"}), el("th",{text:"이렇게 검사합니다"})]));
  names.forEach(name=>{
    const n = parsed.notes[name];
    table.append(el("tr", null, [
      el("td", { class:"nm", text:name }),
      el("td", { text:n.raw.join(" / ") }),
      el("td", { class: n.understood ? "" : "raw", text: noteMeaning(n) })
    ]));
  });
  return el("details", { class:"layout", style:"margin-top:12px" }, [el("summary", { text:"읽어 들인 메모 " + names.length + "개 보기" }), table]);
}

/* ---- 환자별 한눈에 보기 ---- */

const KIND_SHORT = { one:"1:1", robot:"로봇", machine:"기구", electric:"전기", mg:"MG", doshu:"도수", vital:"바이" };

function slotView(list){
  const main = list.filter(e => !e.rideAlong);
  if(main.length === 0) return null;
  const order = ["robot","one","doshu","mg","machine","electric","special","vital"];
  const top = main.slice().sort((a,b) => order.indexOf(a.kind) - order.indexOf(b.kind))[0];
  let text = KIND_SHORT[top.kind] || (top.label || "").slice(0,2);
  if(main.length > 1) text += "+";
  return { kind: top.kind, text };
}

function renderBoard(a){

  const box = el("details", { class:"issue", open:"" });
  box.append(el("summary", null, ["환자별 한눈에 보기", el("span", { class:"tag", text: a.rows.length + "명" })]));

  const search = el("input", { type:"search", placeholder:"환자 이름 찾기" });
  const onlyBad = el("input", { type:"checkbox" });
  const legend = el("div", { class:"legend" });
  [["one","1:1"],["robot","로봇"],["machine","기구"],["electric","전기"],["mg","M·G"],["special","중추·특수·연하 등"],["doshu","도수"]]
    .forEach(([k,t]) => legend.append(el("span", null, [el("i", { class:"k-" + k }), t])));
  legend.append(el("span", null, [el("i", { class:"slot gap", style:"min-width:0;height:11px" }), "빈 시간"]));
  legend.append(el("span", null, [el("i", { style:"box-shadow:0 0 0 2px var(--bad)" }), "중복"]));

  box.append(el("div", { class:"board-tools" }, [
    search,
    el("label", { class:"check" }, [onlyBad, "확인할 곳 있는 환자만"]),
    legend
  ]));

  const table = el("table", { class:"board" });
  const head = el("tr", null, [
    el("th", { style:"text-align:left", text:"환자" }), el("th", { text:"구분" }),
    el("th", { text:"1:1" }), el("th", { text:"로봇" }), el("th", { text:"기구" }), el("th", { text:"전기" }), el("th", { text:"M·G" })
  ]);
  let lunchDone = false;
  a.slots.forEach(s=>{
    if(!lunchDone && s > LUNCH){ head.append(el("th", { class:"lunch" })); lunchDone = true; }
    head.append(el("th", { class:"time", text: minutesText(s) }));
  });
  head.append(el("th", { style:"text-align:left", text:"확인" }));
  table.append(el("thead", null, [head]));

  const tbody = el("tbody");

  const overlapNames = new Set(a.issues.overlap.map(i => i.name));
  const dupNames = new Set(a.issues.columnDup.map(i => i.name));
  const gapNames = new Set(a.issues.continuity.map(i => i.name));
  const routineNames = new Set(a.issues.routine.map(i => i.name));

  a.rows.forEach(row=>{

    const flags = [];
    if(overlapNames.has(row.name)) flags.push("시간 중복");
    if(dupNames.has(row.name)) flags.push("치료사 칸 중복");
    if(gapNames.has(row.name)) flags.push("빈 시간");
    if(routineNames.has(row.name)) flags.push("루틴");

    const c = row.count;
    const num = n => el("td", { class:"num" + (n ? " hit" : ""), text: n ? String(n) : "·" });

    const tr = el("tr", { class: flags.length ? "has-issue" : "" }, [
      el("td", { class:"name" }, [row.name, row.note ? el("span", { class:"memo", title:row.note, text:"메모" }) : null]),
      el("td", null, [row.outpatient ? el("span", { class:"tag", text:"외래" }) : typeTag(row.type)]),
      num(c.one), num(c.robot), num(c.machine), num(c.electric), num(c.mg)
    ]);

    let lunch = false;
    a.slots.forEach(s=>{
      if(!lunch && s > LUNCH){ tr.append(el("td", { class:"lunch" })); lunch = true; }
      const list = row.merged.get(s) || [];
      const view = slotView(list);
      const td = el("td");
      if(view){
        const tip = list.filter(e => !e.rideAlong).map(e => e.ref + " " + e.raw).join("\n");
        td.append(el("span", {
          class:"slot k-" + view.kind + (row.conflicts.includes(s) ? " conflict" : ""),
          title: tip, text: view.text
        }));
      }else if(row.gapSlots.has(s)){
        td.append(el("span", { class:"slot gap", title:"빈 시간" }));
      }
      tr.append(td);
    });

    tr.append(el("td", { class:"state" }, [
      flags.length ? el("span", { class:"bad", text: flags.join(" · ") }) : el("span", { class:"ok", text:"✓" })
    ]));

    tr.dataset.name = row.name;
    tr.dataset.bad = flags.length ? "1" : "";
    tbody.append(tr);
  });

  table.append(tbody);

  const filter = () => {
    const q = search.value.replace(/\s+/g,"");
    tbody.querySelectorAll("tr").forEach(tr=>{
      const show = (!q || tr.dataset.name.includes(q)) && (!onlyBad.checked || tr.dataset.bad);
      tr.style.display = show ? "" : "none";
    });
  };
  search.oninput = filter;
  onlyBad.onchange = filter;

  box.append(el("div", { class:"board-wrap" }, [table]));
  return box;
}

/* ---- 시작 ---- */

window.addEventListener("DOMContentLoaded", ()=>{

  const zone = document.getElementById("pasteZone");
  zone.addEventListener("paste", handlePaste);
  zone.addEventListener("beforeinput", e => { if(e.inputType !== "insertFromPaste") e.preventDefault(); });
  zone.addEventListener("drop", e => e.preventDefault());

  document.getElementById("runButton").onclick = run;
  document.getElementById("printButton").onclick = () => window.print();
  document.getElementById("resetButton").onclick = () => {
    settings = clone(DEFAULT_SETTINGS);
    saveSettings();
    renderSettings();
  };

  renderSettings();
});
</script>
